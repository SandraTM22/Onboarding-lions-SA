<div [class.blur-md]="taskBeingEdited" class="transition duration-300">
  <header class="flex items-center text-cyan-950 font-extrabold">
    <h1 class="h-24 text-3xl p-1 flex-grow text-center content-center">
      Task Page
    </h1>
  
    <button
      routerLink="/"
      class="mr-4 p-2 rounded-lg hover:bg-cyan-600 border-1 border-cyan-950"
    >
      Back
    </button>
  </header>
  
  <main class="p-2 flex flex-col min-h-3/4 max-w-4/5 mx-auto">
    <h2 class="text-xl font-bold text-cyan-800 my-5">Task List</h2>
  
    <form class="space-y-2 mb-8" (ngSubmit)="addTask()">
      <app-error-message [control]="title" fieldName="Title"></app-error-message>
  
      <input
        type="text"
        [formControl]="title"
        placeholder="Title..."
        class="input-class"
      />
  
      <app-error-message
        [control]="describe"
        fieldName="Describe"
      ></app-error-message>
  
      <textarea
        [formControl]="describe"
        placeholder="Describe your task..."
        class="input-class h-40"
        maxlength="255"
        rows="4"
        required
      ></textarea>
  
      <button
        type="submit"
        class="btn-cyan"
        (click)="addTask(); resetForm()"
        [disabled]="title.invalid || describe.invalid"
        [ngClass]="{
          'opacity-50 cursor-not-allowed': title.invalid || describe.invalid
        }"
      >
        Add
      </button>
    </form>
  
    <div>
      <!-- Filtro para busqueda -->
      <form class="max-w-md mx-auto">
        <label for="default-search" class="mb-2 text-cyan-800 sr-only"
          >Search</label
        >
        <!-- Lupa -->
        <div class="relative">
          <div
            class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none"
          >
            <svg
              class="w-4 h-4 text-cyan-950"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 20 20"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
              />
            </svg>
          </div>
  
          <input
            type="search"
            id="default-search"
            class="block !w-full !p-4 !ps-10 text-sm input-class mb-4"
            placeholder="Search tasks..."
            required
            [formControl]="searchControl"
          />
        </div>
      </form>
  
      <!-- <ul *ngIf="filteredTasks.length > 0; else noTasks" class="mt-5">
        <li *ngFor="let task of filteredTasks" class="flex justify-between p-1">
          <span [class.completed]="task.completed" (click)="toggleTask(task)">
            {{ task.title }}
          </span>
          <button (click)="deleteTask(task.id)" class="mx-2 cursor-pointer">
            X
          </button>
        </li>
      </ul> -->
  
      <!-------------------------TASKS LIST-------------------------------->
  
      <div class="relative overflow-x-auto shadow-md sm:rounded-lg mb-4">
        <table
          *ngIf="filteredTasks.length > 0; else noTasks"
          class="w-full text-sm text-left rtl:text-right"
        >
          <thead class="text-xs text-white uppercase bg-cyan-900">
            <tr>
              <th scope="col" class="px-6 py-3 whitespace-nowrap">To do</th>
              <th scope="col" class="px-6 py-3">Title</th>
              <th scope="col" colspan="2" class="px-6 py-3">Description</th>
              <th scope="col" class="px-6 py-3">Action</th>
            </tr>
          </thead>
  
          <tbody>
            <tr
              *ngFor="let task of filteredTasks"
              class="bg-slate-200 text-gray-950 border-b border-gray-200 hover:bg-gray-50"
            >
              <td class="p-4">
                <div class="flex items-center justify-center">
                  <input
                    [checked]="task.completed"
                    (change)="toggleTask(task)"
                    id="checkbox-table-1"
                    type="checkbox"
                    class="h-4 text-cyan-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-cyan-500 focus:ring-2"
                  />
                  <label for="checkbox-table-1" class="sr-only"></label>
                </div>
              </td>
  
              <td
                scope="row"
                class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap"
              >
                {{ task.title }}
              </td>
  
              <td class="px-6 py-4 min-w-40" colspan="2">
                {{ task.description }}
              </td>
  
              <td class="px-6 py-4 max-w-0.5 inline-flex">
                <button class="m-1 cursor-pointer" (click)="updateTask(task)">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#000000"
                  >
                    <path
                      d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"
                    />
                  </svg>
                </button>
                <button class="m-1 cursor-pointer" (click)="deleteTask(task.id)">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    height="24px"
                    viewBox="0 -960 960 960"
                    width="24px"
                    fill="#000000"
                  >
                    <path
                      d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"
                    />
                  </svg>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- --------------------------------------------------- -->
    </div>
  
    <ng-template #noTasks>
      <p class="cursor-default p-2 mt-1 text-xl font-bold bg-cyan-800 opacity-60">
        Nothing here...
      </p>
    </ng-template>
  
   
  </main>
</div>

 <!-- Modal de edición -->
 <div
 *ngIf="taskBeingEdited"
 class="fixed inset-0  bg-opacity-50 flex items-center justify-center z-50"
>
 <div
   class="max-w-sm w-full p-6 bg-white border border-cyan-200 rounded-lg shadow-sm dark:bg-cyan-800 dark:border-cyan-700 mx-auto"
 >
   <h5
     class="mb-2 text-2xl font-bold tracking-tight text-cyan-900 dark:text-white"
   >
     Editar tarea
   </h5>

   <input
     [(ngModel)]="taskBeingEdited.title"
     class="mb-3 w-full p-2 border border-cyan-300 rounded-lg text-cyan-900 dark:bg-cyan-700 dark:text-white dark:placeholder-cyan-300"
     placeholder="Título"
   />

   <textarea
     [(ngModel)]="taskBeingEdited.description"
     rows="4"
     class="mb-4 w-full p-2 border border-cyan-300 rounded-lg text-cyan-900 dark:bg-cyan-700 dark:text-white dark:placeholder-cyan-300"
     placeholder="Descripción"
   ></textarea>

   <div class="flex justify-end gap-2">
     <button
       (click)="cancelEdit()"
       class="px-4 py-2 text-sm font-medium text-cyan-700 bg-white border border-cyan-300 rounded-lg hover:bg-cyan-50 dark:bg-cyan-600 dark:text-white dark:hover:bg-cyan-500"
     >
       Cancelar
     </button>
     <button
       (click)="saveEdit()"
       class="px-4 py-2 text-sm font-medium text-white bg-cyan-700 rounded-lg hover:bg-cyan-800 focus:ring-4 focus:outline-none focus:ring-cyan-300 dark:bg-cyan-600 dark:hover:bg-cyan-700 dark:focus:ring-cyan-800"
     >
       Guardar
     </button>
   </div>
 </div>
</div>

<app-toast></app-toast>
