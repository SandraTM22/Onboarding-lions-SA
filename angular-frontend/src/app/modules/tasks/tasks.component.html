<header class="flex items-center bg-teal-950 text-white">
  <h1 class="h-24 text-2xl p-1 flex-grow text-center content-center">
    Task Page
  </h1>

  <button
    routerLink="/"
    class="mr-4 p-1 rounded-lg hover:bg-teal-600 border-1 border-white"
  >
    Back
  </button>
</header>

<main class="p-2 flex flex-col min-h-screen w-2/3 mx-auto">
  <h2 class="text-xl font-bold text-teal-800 my-5">Task List</h2>

  <form class="space-y-2 mb-8">

    <app-error-message
    [control]="title"
    fieldName="Title"
    ></app-error-message>

    <input
      #taskInput
      type="text"
      [formControl]="title"
      placeholder="Title..."
      class="input-class"
    />

    <app-error-message
      [control]="describe"
      fieldName="Describe"
    ></app-error-message>
    <input
      #taskInput
      type="text"
      [formControl]="describe"
      placeholder="Describe your task..."
      class="input-class h-40"
    />

    <button
      class="bg-teal-950 text-white px-4 py-2 rounded-lg hover:bg-teal-600"
      (click)="addTask(taskInput.value); taskInput.value = ''"
      [disabled]="title.invalid || describe.invalid"
      [ngClass]="{
        'opacity-50 cursor-not-allowed': title.invalid || describe.invalid
      }"
    >
      Add
    </button>
  </form>

  <div>
    <ul *ngIf="tasks.length > 0; else noTasks" class="mt-5">
      <li *ngFor="let task of tasks" class="flex justify-between p-1">
        <span [class.completed]="task.completed" (click)="toggleTask(task)">
          {{ task.title }}
        </span>
        <button (click)="deleteTask(task.id)" class="mx-2 cursor-pointer">
          ❌
        </button>
      </li>
    </ul>
  </div>

  <ng-template #noTasks>
    <p class="cursor-default">Nothing here...</p>
  </ng-template>
</main>
